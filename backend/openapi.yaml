openapi: 3.0.3
info:
  title: XWZ Parking API
  version: 1.0.0
  description: JWT-secured parking management backend for XWZ LTD.
servers:
  - url: http://localhost:4000/api
    description: Local
tags:
  - name: Auth
  - name: Parkings
  - name: Sessions
  - name: Reports
  - name: Logs
paths:
  /health:
    get:
      summary: Health check
      tags: [Auth]
      responses:
        "200":
          description: OK
  /auth/register:
    post:
      summary: Register (defaults to parking attendant)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, password]
              properties:
                firstName: { type: string }
                lastName: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "201": { description: Created }
        "400": { description: Validation error }
        "409": { description: Email already in use }
  /auth/login:
    post:
      summary: Login and receive JWT
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200": { description: Token issued }
        "401": { description: Invalid credentials }
  /auth/me:
    get:
      summary: Current user
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: User profile }
        "401": { description: Unauthorized }
  /parkings:
    get:
      summary: List parkings (paginated)
      tags: [Parkings]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
      responses:
        "200": { description: OK }
    post:
      summary: Create parking (admin only)
      tags: [Parkings]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParkingInput"
      responses:
        "201": { description: Created }
        "403": { description: Forbidden }
  /parkings/{id}:
    get:
      summary: Get parking by id
      tags: [Parkings]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
        "404": { description: Not found }
    put:
      summary: Update parking (admin only)
      tags: [Parkings]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParkingUpdate"
      responses:
        "200": { description: Updated }
    delete:
      summary: Delete parking (admin only)
      tags: [Parkings]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
  /sessions/entry:
    post:
      summary: Register car entry (ticket issued)
      tags: [Sessions]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryInput"
      responses:
        "201": { description: Session created }
        "409": { description: No spaces available }
  /sessions/{id}/exit:
    post:
      summary: Register car exit (bill computed)
      tags: [Sessions]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                exitAt:
                  type: string
                  format: date-time
                  description: Defaults to now
      responses:
        "200": { description: Bill returned }
        "400": { description: Already exited }
  /sessions/active:
    get:
      summary: List active sessions (paginated)
      tags: [Sessions]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        "200": { description: OK }
  /reports/outgoing:
    get:
      summary: Outgoing cars between two datetimes (includes revenue sum)
      tags: [Reports]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        "200": { description: OK }
  /reports/entries:
    get:
      summary: Cars that entered between two datetimes
      tags: [Reports]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        "200": { description: OK }
  /logs:
    get:
      summary: Activity logs (admin only, paginated)
      tags: [Logs]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        "200": { description: OK }
        "403": { description: Forbidden }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ParkingInput:
      type: object
      required: [code, name, totalSpaces, location, feePerHour]
      properties:
        code: { type: string }
        name: { type: string }
        totalSpaces: { type: integer, minimum: 1 }
        location: { type: string }
        feePerHour: { type: number, minimum: 0 }
    ParkingUpdate:
      type: object
      properties:
        name: { type: string }
        totalSpaces: { type: integer, minimum: 1 }
        location: { type: string }
        feePerHour: { type: number, minimum: 0 }
    EntryInput:
      type: object
      required: [plateNumber, parkingCode]
      properties:
        plateNumber: { type: string }
        parkingCode: { type: string }
        entryAt:
          type: string
          format: date-time
